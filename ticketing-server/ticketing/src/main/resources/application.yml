server:
  port: 8081

spring:
  application:
    name: ticketing
  datasource:
    url: jdbc:postgresql://postgres-service:5432/ticketing
    username: ticketing
    password: ticketing
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100
    open-in-view: false
  kafka:
    bootstrap-servers: kafka-service:9092
    consumer:
      group-id: ticketing-group
  data:
    redis:
      host: redis-service
      port: 6379
      password: ""

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: ticketing

app:
  jwt:
    issuer: "no24-api-server"
    audience: "no24-tkt-server"
    expiration-seconds: 3600
  kafka:
    payment-topic: ticketing.payment.requested
    payment-concurrency: 5       # Kafka 파티션 수와 반드시 일치시킬 것
    payment-worker-threads: 100  # 실제 결제 처리 worker 수 (concurrency와 독립적으로 조정)
