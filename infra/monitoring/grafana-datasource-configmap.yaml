apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-config
  namespace: default
data:
  # Grafana가 /etc/grafana/provisioning/datasources/ 에서 읽음
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-service:9090
        isDefault: true
        access: proxy
        editable: false

  # Grafana가 /etc/grafana/provisioning/dashboards/ 에서 읽음
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: ticketing
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
