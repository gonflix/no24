apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: default
data:
  ticketing.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"fillOpacity": 10, "lineWidth": 2},
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [
            {
              "expr": "rate(payment_completed_total{application=\"ticketing\"}[1m])",
              "legendFormat": "TPS",
              "refId": "A"
            }
          ],
          "title": "Payment TPS",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"fillOpacity": 10, "lineWidth": 2},
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [
            {
              "expr": "sum(jvm_memory_used_bytes{application=\"ticketing\",area=\"heap\"})",
              "legendFormat": "Used",
              "refId": "A"
            },
            {
              "expr": "sum(jvm_memory_max_bytes{application=\"ticketing\",area=\"heap\"})",
              "legendFormat": "Max",
              "refId": "B"
            }
          ],
          "title": "JVM Heap",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"fillOpacity": 10, "lineWidth": 2},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [
            {
              "expr": "sum(http_server_requests_active_seconds_count{application=\"ticketing\"})",
              "legendFormat": "Active Requests",
              "refId": "A"
            }
          ],
          "title": "HTTP Active Requests",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"fillOpacity": 10, "lineWidth": 2},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "id": 5,
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [
            {
              "expr": "executor_active_threads{application=\"ticketing\",name=\"paymentWorkerExecutor\"}",
              "legendFormat": "Active",
              "refId": "A"
            },
            {
              "expr": "executor_pool_size_threads{application=\"ticketing\",name=\"paymentWorkerExecutor\"}",
              "legendFormat": "Pool Size",
              "refId": "B"
            }
          ],
          "title": "Worker Pool — Active Threads",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"fillOpacity": 10, "lineWidth": 2},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "id": 6,
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [
            {
              "expr": "executor_queued_tasks{application=\"ticketing\",name=\"paymentWorkerExecutor\"}",
              "legendFormat": "Queue Depth",
              "refId": "A"
            }
          ],
          "title": "Worker Pool — Queue Depth",
          "type": "timeseries"
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["ticketing", "performance"],
      "time": {"from": "now-5m", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "Ticketing Server Performance",
      "uid": "ticketing-perf",
      "version": 1
    }
