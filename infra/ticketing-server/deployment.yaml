apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketing-server-deployment
  namespace: default
  labels:
    app: ticketing-server
spec:
#  replicas: 2 # 가용성을 위해 2개의 복제본 유지
  selector:
    matchLabels:
      app: ticketing-server
  template:
    metadata:
      labels:
        app: ticketing-server
    spec:
      # 1. Docker Hub 인증을 위한 Secret 연결
      imagePullSecrets:
      - name: dockerhub-config
      containers:
      - name: ticketing-server-container
        image: docker.io/gonflix/no24-svc:1691a098ce35f28984dd8fb093e952238be26236
#        ports:
#        - containerPort: 8080 
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
