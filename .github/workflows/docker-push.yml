name: Build and Push Go & Java Services

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build flags
        id: flags
        run: |
          echo "build_api=${{ contains(github.event.head_commit.message, '[build-api]') }}" >> "$GITHUB_OUTPUT"
          echo "build_tkt=${{ contains(github.event.head_commit.message, '[build-tkt]') }}" >> "$GITHUB_OUTPUT"


      # 1. Go 서버 빌드 및 푸시 (no24-api).
      - name: Build and push Go API
        if: steps.flags.outputs.build_api == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./api-server # Go 프로젝트 폴더 경로
          file: ./api-server/no24_api_Dockerfile
          push: true
          tags: |
            gonflix/no24-api:latest
            gonflix/no24-api:${{ github.sha }}

      # 2. Java 서버 빌드 및 푸시 (no24-svc)
      - name: Build and push Java SVC
        if: steps.flags.outputs.build_tkt == 'true'
        # 해킹으로 인한 토큰 탈취 방지위해 버전 고정
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./ticketing-server # Java 프로젝트 폴더 경로
          file: ./ticketing-server/no24_svc_Dockerfile
          push: true
          tags: |
            gonflix/no24-svc:latest
            gonflix/no24-svc:${{ github.sha }}

      - name: Update api-server deployment tag
        if: steps.flags.outputs.build_api == 'true'
        run: |
          cd infra
          sed -i "s|gonflix/no24-api:.*|gonflix/no24-api:${{ github.sha }}|g" api-server/deployment.yaml

      - name: Update ticketing-server deployment tag
        if: steps.flags.outputs.build_tkt == 'true'
        run: |
          cd infra
          sed -i "s|gonflix/no24-svc:.*|gonflix/no24-svc:${{ github.sha }}|g" ticketing-server/deployment.yaml

      - name: Commit and push updated deployment tags
        if: steps.flags.outputs.build_api == 'true' || steps.flags.outputs.build_tkt == 'true'
        run: |
          cd infra
          # 변경사항을 Git에 커밋하고 푸시
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: update image tag to ${{ github.sha }}"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "No deployment changes to commit."
          fi
